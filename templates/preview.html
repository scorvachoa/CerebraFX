<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Inter',sans-serif}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;transform-origin:center center;flex-shrink:0;background:#0a0a1a}
#c{position:absolute;top:0;left:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scene{position:absolute;top:0;left:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 80px;opacity:0;will-change:transform,opacity}
.scene-inner{text-align:center;position:relative;z-index:2;max-width:920px;width:100%}
.label{font-size:56px;margin-bottom:30px;line-height:1;display:inline-block}
.text{font-size:68px;font-weight:900;color:#fff;line-height:1.4;text-shadow:0 4px 40px rgba(0,0,0,.5);margin-bottom:30px}
.word{display:inline-block;opacity:0;transform:translateY(30px)}
.katex-wrap{font-size:clamp(36px,4vw,72px);padding:24px;margin:8px 0;color:#fff;opacity:0;transform:scale(0.5);border-radius:20px;position:relative}
.kf-glow{position:absolute;inset:-4px;border-radius:24px;background:linear-gradient(135deg,#6c63ff33,#00d4ff33);opacity:0;filter:blur(20px);z-index:-1}
.katex-wrap .katex{font-size:1em}
canvas.gc{width:800px;height:600px;border-radius:24px;margin:10px auto;display:block;opacity:0}
canvas.vc{width:700px;height:700px;border-radius:24px;margin:10px auto;display:block;opacity:0}
.bg-c{position:absolute;border-radius:50%;opacity:.08;filter:blur(100px);pointer-events:none}
.b1{width:700px;height:700px;background:#6c63ff;top:-200px;right:-200px}
.b2{width:500px;height:500px;background:#00d4ff;bottom:-150px;left:-150px}
.pw{position:absolute;bottom:40px;left:80px;right:80px;z-index:10}
.pb{width:100%;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.pf{height:100%;width:0%;background:linear-gradient(90deg,#6c63ff,#00d4ff)}
#toplogo{position:absolute;top:52px;left:0;width:1080px;text-align:center;z-index:6;pointer-events:none}
.tl-logo{display:inline-flex;align-items:center;gap:14px;padding:10px 28px;border-radius:44px;background:rgba(10,10,30,0.4);border:1px solid rgba(255,255,255,0.09);box-shadow:0 4px 30px rgba(0,0,0,.3)}
.tl-mark{width:46px;height:46px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;flex-shrink:0}
.tl-img{width:46px;height:46px;object-fit:contain;border-radius:13px;flex-shrink:0}
.tl-text{font-size:30px;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="toplogo"></div><div id="c"></div><div class="pw"><div class="pb"><div class="pf" id="pf"></div></div></div></div></div>
<script>
(function(){
function fit(){
  var s=document.getElementById('stage');
  var sw=window.innerWidth,sh=window.innerHeight;
  var scale=Math.min(sw/1080,sh/1920,0.85);
  s.style.transform='scale('+scale+')';
}
window.addEventListener('resize',fit);
fit();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<script>
{{GRAPH_ENGINE}}
</script>
<script>
var scene={{SCENE}};
var duration={{DURATION}};
var FPS={{FPS}};
var BRAND={{BRAND}};
var D=duration>0?duration:8;

// Logo persistente superior
(function(){
  var tl=document.getElementById('toplogo');
  var name=BRAND.name||'CerebraFX';
  var inner;
  if(BRAND.logo_image){
    inner='<div class="tl-logo"><img class="tl-img" src="'+BRAND.logo_image+'"><span class="tl-text">'+name+'</span></div>';
  }else{
    inner='<div class="tl-logo"><div class="tl-mark" style="background:'+BRAND.logo_color+'">'+name.charAt(0).toUpperCase()+'</div><span class="tl-text">'+name+'</span></div>';
  }
  tl.innerHTML=inner;
})();

var E={hook:'\u2753',formula:'\uD83D\uDCD0',step:'\uD83D\uDC49',graph:'\uD83D\uDCC8',visual:'\u25B2',list:'\uD83D\uDD38',conclusion:'\uD83C\uDFAF'};

function renderWordLatex(el){
  var txt=el.textContent;
  var parts=txt.split(/(\\[a-zA-Z]+(?:\{[^}]*\})*)/);
  if(parts.length<2)return;
  var h='';
  for(var j=0;j<parts.length;j++){
    if(parts[j].charAt(0)==='\\'&&parts[j].length>1){
      try{h+=katex.renderToString(parts[j],{throwOnError:false});}catch(e){h+=parts[j];}
    }else{h+=parts[j];}
  }
  if(h!==txt)el.innerHTML=h;
}

var c=document.getElementById('c');
var bg1=document.createElement('div');bg1.className='bg-c b1';c.appendChild(bg1);
var bg2=document.createElement('div');bg2.className='bg-c b2';c.appendChild(bg2);

var div=document.createElement('div');div.className='scene';
var s=scene;
var gr='#0a0a2e,#1a1a4e,#0a0a2e';
div.style.background='linear-gradient(135deg,'+gr+')';
var html='<div class="scene-inner">';
html+='<div class="label">'+(E[s.type]||'\uD83D\uDCCC')+'</div>';
html+='<div class="text" id="tw">';
var words=(s.text||'').split(' ');
for(var wi=0;wi<words.length;wi++){html+='<span class="word" id="w'+wi+'">'+words[wi]+(wi<words.length-1?'&nbsp;':'')+'</span>';}
html+='</div>';
if(s.formula){html+='<div class="katex-wrap" id="kf"><div class="kf-glow" id="kg"></div></div>';}
if(s.type==='graph'){html+='<canvas class="gc" id="gcv" width="800" height="600"></canvas>';}
if(s.type==='visual'){html+='<canvas class="vc" id="vcv" width="700" height="700"></canvas>';}
html+='</div>';
div.innerHTML=html;
c.appendChild(div);

var labelEl=div.querySelector('.label');
var wordEls=[];for(var wi=0;wi<words.length;wi++)wordEls.push(document.getElementById('w'+wi));
var kfEl=s.formula?document.getElementById('kf'):null;
var kgEl=s.formula?document.getElementById('kg'):null;
var gcEl=s.type==='graph'?document.getElementById('gcv'):null;
var vcEl=s.type==='visual'?document.getElementById('vcv'):null;

var tw=document.getElementById('tw');
if(tw)tw.querySelectorAll('.word').forEach(renderWordLatex);
if(kfEl){try{katex.render(s.formula,kfEl,{displayMode:true,throwOnError:false});}catch(e){}}

function clamp01(x){return Math.min(1,Math.max(0,x));}
function easeOut(x){return 1-Math.pow(1-x,3);}

function renderPreview(lt){
  var fi=Math.min(0.5,D*0.12);
  var fo=Math.min(0.4,D*0.08);
  var alpha=1,scale=1,y=0;
  if(lt<fi){var k=easeOut(clamp01(lt/fi));alpha=k;scale=0.92+0.08*k;y=50*(1-k);}
  else if(lt>D-fo){var k2=clamp01((lt-(D-fo))/fo);alpha=1-k2;scale=1+0.04*k2;y=-15*k2;}
  div.style.opacity=alpha;
  div.style.transform='scale('+scale+') translateY('+y+'px)';

  var lk=clamp01(lt/0.4);
  labelEl.style.opacity=lk;
  labelEl.style.transform='scale('+lk+') rotate('+(-20*(1-lk))+'deg)';

  var animStart=fi+0.05;
  for(var w=0;w<wordEls.length;w++){
    var wa=clamp01((lt-(animStart+w*0.07))/0.35);
    wordEls[w].style.opacity=wa;
    wordEls[w].style.transform='translateY('+(30*(1-wa))+'px)';
  }

  if(kfEl){
    var ft=animStart+wordEls.length*0.07+0.05;
    var fa=clamp01((lt-ft)/0.5);
    kfEl.style.opacity=fa;
    kfEl.style.transform='scale('+(0.5+0.5*fa)+') translateY('+(-3*Math.sin(lt*1.5))+')';
    kgEl.style.opacity=fa;
  }

  if(gcEl){
    var at=animStart+wordEls.length*0.07+0.05+(kfEl?0.5:0);
    gcEl.style.opacity=clamp01((lt-at)/0.2);
    drawGraph('gcv',s,clamp01((lt-at-0.1)/(D*0.55)));
  }
  if(vcEl){
    var at2=animStart+wordEls.length*0.07+0.05+(kfEl?0.5:0);
    vcEl.style.opacity=clamp01((lt-at2)/0.2);
    drawVisual('vcv',s,clamp01((lt-at2-0.1)/(D*0.55)));
  }
  document.getElementById('pf').style.width=(clamp01(lt/D)*100)+'%';
}

var t0=performance.now();
(function loop(now){
  var lt=((now-t0)/1000)%D;
  renderPreview(lt);
  requestAnimationFrame(loop);
})(t0);
</script>
</body>
</html>
