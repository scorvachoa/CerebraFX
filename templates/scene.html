<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Math Video</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a1a}
#c{width:1080px;height:1920px;position:relative}

#particles{position:fixed;top:0;left:0;width:1080px;height:1920px;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;border-radius:50%;background:rgba(255,255,255,0.04);animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:0.5}90%{opacity:0.5}100%{transform:translateY(-1920px) rotate(720deg);opacity:0}}
.scene{position:absolute;top:0;left:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;will-change:transform,opacity;padding:60px 80px}
.scene-inner{text-align:center;position:relative;z-index:2;max-width:920px;width:100%}
.label{font-size:56px;margin-bottom:30px;line-height:1;display:inline-block}
.text{font-size:68px;font-weight:900;color:#fff;line-height:1.4;text-shadow:0 4px 40px rgba(0,0,0,.5);margin-bottom:30px}
.word{display:inline-block;opacity:0;transform:translateY(30px)}
.katex-wrap{font-size:clamp(36px,4vw,72px);padding:24px;margin:8px 0;color:#fff;opacity:0;transform:scale(0.5);border-radius:20px;position:relative}
.kf-glow{position:absolute;inset:-4px;border-radius:24px;background:linear-gradient(135deg,#6c63ff33,#00d4ff33);opacity:0;filter:blur(20px);z-index:-1}
.katex-wrap .katex{font-size:1em}
canvas.gc{width:800px;height:600px;border-radius:24px;margin:10px auto;display:block;opacity:0}
canvas.vc{width:700px;height:700px;border-radius:24px;margin:10px auto;display:block;opacity:0}
.bg-c{position:absolute;border-radius:50%;opacity:.08;filter:blur(100px);pointer-events:none}
.b1a{width:700px;height:700px;background:#6c63ff;top:-200px;right:-200px}
.b1b{width:500px;height:500px;background:#00d4ff;bottom:-150px;left:-150px}
.b2a{width:600px;height:600px;background:#ff6b6b;top:-150px;left:-100px}
.b2b{width:400px;height:400px;background:#ffd93d;bottom:-100px;right:-100px}
.b3a{width:800px;height:800px;background:#6c63ff;top:-300px;right:-100px}
.b3b{width:450px;height:450px;background:#00d4ff;bottom:-80px;left:-80px}
.b4a{width:550px;height:550px;background:#ff6b6b;top:-100px;right:-50px}
.b4b{width:650px;height:650px;background:#6c63ff;bottom:-200px;left:-200px}
.b5a{width:500px;height:500px;background:#ffd93d;top:-120px;left:-80px}
.b5b{width:700px;height:700px;background:#00d4ff;bottom:-180px;right:-180px}
.b6a{width:600px;height:600px;background:#6c63ff;top:-250px;left:-50px}
.b6b{width:500px;height:500px;background:#ff6b6b;bottom:-120px;right:-120px}
.pw{position:absolute;bottom:100px;left:80px;right:80px;z-index:10}
.pb{width:100%;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.pf{height:100%;width:0%;background:linear-gradient(90deg,#6c63ff,#00d4ff);border-radius:2px}
.sc{text-align:center;margin-top:16px;font-size:20px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:2px}
.v{position:fixed;bottom:0;left:0;width:1080px;height:280px;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none;z-index:3}

/* Logo persistente superior centrado */
#toplogo{position:absolute;top:52px;left:0;width:1080px;text-align:center;z-index:6;pointer-events:none}
.tl-logo{display:inline-flex;align-items:center;gap:14px;padding:10px 28px;border-radius:44px;background:rgba(10,10,30,0.4);border:1px solid rgba(255,255,255,0.09);box-shadow:0 4px 30px rgba(0,0,0,.3)}
.tl-mark{width:46px;height:46px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;flex-shrink:0}
.tl-img{width:46px;height:46px;object-fit:contain;border-radius:13px;flex-shrink:0}
.tl-text{font-size:30px;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.4)}

/* Pantalla de cierre */
.end-box{text-align:center;padding-top:40px}
.end-logo{display:inline-flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:scale(0.5)}
.end-logo img{width:280px;height:280px;object-fit:contain;border-radius:32px;box-shadow:0 0 90px rgba(108,99,255,.35)}
.end-logo-text{font-size:118px;font-weight:900;color:#fff;line-height:1.1;text-shadow:0 10px 60px rgba(0,0,0,.5),0 0 90px rgba(108,99,255,.45)}
.end-channel{font-size:46px;font-weight:700;color:rgba(255,255,255,.88);opacity:0;margin-top:14px;letter-spacing:1px}
.sub-wrap{position:relative;display:inline-block;margin-top:84px}
.sub-ring{position:absolute;inset:-16px;border-radius:80px;border:6px solid rgba(255,255,255,.14);opacity:0}
.sub-ring2{position:absolute;inset:-16px;border-radius:80px;border:6px solid transparent;border-top-color:#ffd93d;opacity:0}
.sub-btn{display:inline-flex;align-items:center;gap:18px;padding:28px 64px;border:none;border-radius:76px;background:linear-gradient(135deg,#ff2b2b,#ff5f6d);color:#fff;font-family:'Inter',sans-serif;font-size:48px;font-weight:900;cursor:pointer;box-shadow:0 12px 60px rgba(255,43,43,.45);position:relative;opacity:0}
.sub-icon{font-size:36px}
.end-tagline{font-size:38px;font-weight:500;color:rgba(255,255,255,.55);opacity:0;margin-top:80px}
</style>
</head>
<body>
<div id="particles"></div>
<div id="toplogo"></div>
<div id="c"></div>
<div class="v"></div>
<div class="pw"><div class="pb"><div class="pf" id="pf"></div></div><div class="sc" id="sc"></div></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<script>
{{GRAPH_ENGINE}}
</script>
<script>
(function(){
// Floating background particles
(function(){
  var pc=document.getElementById('particles');
  for(var i=0;i<25;i++){
    var p=document.createElement('div');
    p.className='p';
    var size=4+Math.random()*8;
    p.style.width=size+'px';
    p.style.height=size+'px';
    p.style.left=Math.random()*1080+'px';
    p.style.bottom='-'+size+'px';
    p.style.animationDuration=(15+Math.random()*25)+'s';
    p.style.animationDelay=(Math.random()*20)+'s';
    if(Math.random()>0.5)p.style.background='rgba(108,99,255,'+(0.03+Math.random()*0.06)+')';
    pc.appendChild(p);
  }
})();

var scenes={{SCENES}};
var T={{DURATION}};
var FPS={{FPS}};
var BRAND={{BRAND}};
var N=scenes.length;

window.FPS=FPS;
window.totalFrames=Math.max(1,Math.round(T*FPS));
window.__READY=false;

// Escala el diseño 1080x1920 para que quepa en el viewport real (RENDER_SCALE<1)
// y no recortar el contenido (determinista: solo depende del viewport fijo).
(function(){
  var k=Math.min(window.innerWidth/1080, window.innerHeight/1920);
  if(k>0 && (k<0.999 || k>1.001)){
    document.body.style.transformOrigin='0 0';
    document.body.style.transform='scale('+k+')';
  }
})();

// Logo persistente superior
(function(){
  var tl=document.getElementById('toplogo');
  var name=BRAND.name||'CerebraFX';
  var inner;
  if(BRAND.logo_image){
    inner='<div class="tl-logo"><img class="tl-img" src="'+BRAND.logo_image+'"><span class="tl-text">'+name+'</span></div>';
  }else{
    inner='<div class="tl-logo"><div class="tl-mark" style="background:'+BRAND.logo_color+'">'+name.charAt(0).toUpperCase()+'</div><span class="tl-text">'+name+'</span></div>';
  }
  tl.innerHTML=inner;
})();

var E={hook:'\u2753',formula:'\uD83D\uDCD0',step:'\uD83D\uDC49',graph:'\uD83D\uDCC8',visual:'\u25B2',list:'\uD83D\uDD38',conclusion:'\uD83C\uDFAF'};
var GR=[
  '#0a0a2e,#1a1a4e,#0a0a2e',
  '#1a0a2e,#4a1a6e,#1a0a2e',
  '#0a1a2e,#1a4a6e,#0a1a2e',
  '#2e0a0a,#6e1a1a,#2e0a0a',
  '#0a2e1a,#1a6e4a,#0a2e1a',
  '#2e1a0a,#6e4a1a,#2e1a0a',
  '#0a0a1a,#2a1a4a,#0a0a1a',
  '#1a0a0a,#4a1a1a,#1a0a0a'
];
var BC=['b1a b1b','b2a b2b','b3a b3b','b4a b4b','b5a b5b','b6a b6b','b1a b1b','b2a b2b'];

function renderWordLatex(el){
  var txt=el.textContent;
  var parts=txt.split(/(\\[a-zA-Z]+(?:\{[^}]*\})*)/);
  if(parts.length<2)return;
  var h='';
  for(var j=0;j<parts.length;j++){
    if(parts[j].charAt(0)==='\\'&&parts[j].length>1){
      try{h+=katex.renderToString(parts[j],{throwOnError:false});}catch(e){h+=parts[j];}
    }else{h+=parts[j];}
  }
  if(h!==txt)el.innerHTML=h;
}

var c=document.getElementById('c');
var sceneEls=[],labelEls=[],wordEls=[],formulaEls=[],glowEls=[],graphCvs=[],visualCvs=[],bgEls=[];

scenes.forEach(function(s,i){
  var div=document.createElement('div');
  div.className='scene';
  div.style.background='linear-gradient(135deg,'+GR[i%GR.length]+')';
  var bgs=BC[i%BC.length].split(' ');
  var html='<div class="bg-c '+bgs[0]+'"></div><div class="bg-c '+bgs[1]+'"></div>';
  html+='<div class="scene-inner">';

  if(s.type==='end'){
    html+='<div class="end-box">';
    html+='<div class="end-logo" id="el'+i+'">';
    if(BRAND.logo_image){html+='<img src="'+BRAND.logo_image+'">';}
    else{html+='<span class="end-logo-text" id="elt'+i+'"></span>';}
    html+='</div>';
    html+='<div class="end-channel" id="ech'+i+'"></div>';
    if(BRAND.subscribe_button){
      html+='<div class="sub-wrap" id="subw'+i+'">';
      html+='<div class="sub-ring" id="subr'+i+'"></div>';
      html+='<div class="sub-ring2" id="subr2'+i+'"></div>';
      html+='<button class="sub-btn" id="subb'+i+'"><span class="sub-icon">\u25B6</span><span id="subt'+i+'"></span></button>';
      html+='</div>';
    }
    html+='<div class="end-tagline" id="etl'+i+'"></div>';
    html+='</div>';
  }else{
  html+='<div class="label">'+(E[s.type]||'\uD83D\uDCCC')+'</div>';

  if(s.type==='list'&&s.items){
    html+='<div class="text" id="tw'+i+'">';
    for(var li=0;li<s.items.length;li++){
      html+='<div class="word" id="l'+i+'_'+li+'" style="margin-bottom:20px;font-size:52px">\u2022 '+s.items[li]+'</div>';
    }
    html+='</div>';
  }else{
    var words=(s.text||'').split(' ');
    html+='<div class="text" id="tw'+i+'">';
    for(var wi=0;wi<words.length;wi++){
      html+='<span class="word" id="w'+i+'_'+wi+'">'+words[wi]+(wi<words.length-1?'&nbsp;':'')+'</span>';
    }
    html+='</div>';
  }

  if(s.formula){
    html+='<div class="katex-wrap" id="kf'+i+'"><div class="kf-glow" id="kg'+i+'"></div></div>';
  }
  if(s.type==='graph'){
    html+='<canvas class="gc" id="gcv'+i+'" width="800" height="600"></canvas>';
  }
  if(s.type==='visual'){
    html+='<canvas class="vc" id="vcv'+i+'" width="700" height="700"></canvas>';
  }
  }
  html+='</div>';
  div.innerHTML=html;
  c.appendChild(div);

  sceneEls.push(div);
  labelEls.push(s.type==='end'?null:div.querySelector('.label'));
  bgEls.push(div.querySelectorAll('.bg-c'));
  if(s.type==='end'){
    wordEls.push([]);
  }else if(s.type==='list'&&s.items){
    var le=[];
    for(var li=0;li<s.items.length;li++)le.push(document.getElementById('l'+i+'_'+li));
    wordEls.push(le);
  }else{
    var we=[];
    for(var wi=0;wi<(s.text? s.text.split(' ').length:0);wi++)we.push(document.getElementById('w'+i+'_'+wi));
    wordEls.push(we);
  }
  formulaEls.push(s.formula?document.getElementById('kf'+i):null);
  glowEls.push(s.formula?document.getElementById('kg'+i):null);
  graphCvs.push(s.type==='graph'?document.getElementById('gcv'+i):null);
  visualCvs.push(s.type==='visual'?document.getElementById('vcv'+i):null);
});

// Render LaTeX inline in word spans
for(var wi=0;wi<N;wi++){
  var tw=document.getElementById('tw'+wi);
  if(tw)tw.querySelectorAll('.word').forEach(renderWordLatex);
}

// Render formulas at build time (deterministic, no timing dependency)
for(var fi=0;fi<N;fi++){
  if(formulaEls[fi]){
    try{katex.render(scenes[fi].formula,formulaEls[fi],{displayMode:true,throwOnError:false});}catch(e){}
  }
}

function clamp01(x){return Math.min(1,Math.max(0,x));}
function easeOut(x){return 1-Math.pow(1-x,3);}

var fallbackD = N>0? T/N : 5;

function renderEndScene(i,lt){
  var logo=document.getElementById('el'+i);
  var logoText=document.getElementById('elt'+i);
  var channel=document.getElementById('ech'+i);
  var subw=document.getElementById('subw'+i);
  var ring=document.getElementById('subr'+i);
  var ring2=document.getElementById('subr2'+i);
  var subb=document.getElementById('subb'+i);
  var subt=document.getElementById('subt'+i);
  var tagline=document.getElementById('etl'+i);

  if(logoText)logoText.textContent=BRAND.name;
  if(channel)channel.textContent=BRAND.subscribe_channel||'@';
  if(subt)subt.textContent=BRAND.subscribe_text||'Suscr\u00EDbete';
  if(tagline)tagline.textContent=BRAND.tagline||'';

  // logo grande centrado
  var lk=clamp01((lt-0.4)/0.6);
  if(logo){
    logo.style.opacity=lk;
    logo.style.transform='scale('+(0.5+0.5*lk)+')';
  }
  // canal
  if(channel){
    var ck=clamp01((lt-1.0)/0.4);
    channel.style.opacity=ck;
    channel.style.transform='translateY('+(20*(1-ck))+'px)';
  }
  // botón suscripción animado
  if(subw&&subb){
    var bstart=1.4;
    var bpop=clamp01((lt-bstart)/0.35);
    var overshoot=1+0.18*Math.sin(Math.min(bpop,1)*Math.PI);
    var pulse=1+0.05*Math.sin(lt*3.2);
    subb.style.opacity=bpop;
    subb.style.transform='scale('+(overshoot*pulse)+')';
    // anillo de progreso que se llena hasta "suscribirse"
    if(ring2){
      var prog=clamp01((lt-1.8)/1.6);
      ring2.style.opacity=clamp01((lt-1.8)/0.2);
      ring2.style.transform='rotate('+(prog*360)+'deg)';
    }
    if(ring){
      var rg=clamp01((lt-1.8)/1.6);
      ring.style.opacity=rg*0.9;
      ring.style.boxShadow=rg>=1?'0 0 60px rgba(255,217,61,0.5)':'none';
    }
    // destello "suscrito" al final
    if(lt>3.4&&BRAND.subscribe_text){
      var flash=clamp01((lt-3.4)/0.3);
      subb.style.boxShadow='0 12px 60px rgba(255,43,43,.45), 0 0 '+ (80*flash) +'px rgba(255,255,255,'+(0.6*flash)+')';
    }
  }
  // tagline
  if(tagline){
    var tg=clamp01((lt-2.6)/0.5);
    tagline.style.opacity=tg;
    tagline.style.transform='translateY('+(18*(1-tg))+'px)';
  }
}

function renderFrame(f){
  var t=f/FPS;
  document.getElementById('pf').style.width=(clamp01(t/T)*100)+'%';

  // localizar escena activa
  var idx=-1,lt=0,acc=0;
  for(var i=0;i<N;i++){
    var d=scenes[i].d>0?scenes[i].d:fallbackD;
    if(t<acc+d){idx=i;lt=t-acc;break;}
    acc+=d;
  }
  if(idx<0){idx=N-1;lt=scenes[N-1].d>0?scenes[N-1].d:fallbackD;}

  document.getElementById('sc').textContent=(idx+1)+' / '+N;

  for(var j=0;j<N;j++){
    var el=sceneEls[j];
    var s=scenes[j];
    var d=s.d>0?s.d:fallbackD;
    if(j!==idx){
      el.style.opacity=0;
      el.style.transform='scale(1) translateY(0)';
      continue;
    }
    var fi=Math.min(0.5,d*0.12);
    var fo=(j===N-1)?0:Math.min(0.4,d*0.08);
    var alpha=1,scale=1,y=0;
    if(lt<fi){
      var k=easeOut(clamp01(lt/fi));
      alpha=k;scale=0.92+0.08*k;y=50*(1-k);
    }else if(lt>d-fo&&fo>0){
      var k2=clamp01((lt-(d-fo))/fo);
      alpha=1-k2;scale=1+0.04*k2;y=-15*k2;
    }
    el.style.opacity=alpha;
    el.style.transform='scale('+scale+') translateY('+y+'px)';

    // pantalla de cierre
    if(s.type==='end'){
      renderEndScene(j,lt);
      continue;
    }

    // label pop
    var lk=clamp01(lt/0.4);
    if(labelEls[j]){
      labelEls[j].style.opacity=lk;
      labelEls[j].style.transform='scale('+lk+') rotate('+(-20*(1-lk))+'deg)';
    }

    // palabras
    var animStart=fi+0.05;
    var ws=wordEls[j];
    for(var w=0;w<ws.length;w++){
      var wa=clamp01((lt-(animStart+w*0.07))/0.35);
      ws[w].style.opacity=wa;
      ws[w].style.transform='translateY('+(30*(1-wa))+'px)';
    }

    // fórmula
    if(formulaEls[j]){
      var ft=animStart+ws.length*0.07+0.05;
      var fa=clamp01((lt-ft)/0.5);
      formulaEls[j].style.opacity=fa;
      formulaEls[j].style.transform='scale('+(0.5+0.5*fa)+') translateY('+(-3*Math.sin(lt*1.5))+')';
      glowEls[j].style.opacity=fa;
    }

    // gráfico
    if(graphCvs[j]){
      var at=animStart+ws.length*0.07+0.05+(formulaEls[j]?0.5:0);
      var cvis=clamp01((lt-at)/0.2);
      graphCvs[j].style.opacity=cvis;
      drawGraph('gcv'+j,s,clamp01((lt-at-0.1)/(d*0.55)));
    }
    // visual
    if(visualCvs[j]){
      var at2=animStart+ws.length*0.07+0.05+(formulaEls[j]?0.5:0);
      var cvis2=clamp01((lt-at2)/0.2);
      visualCvs[j].style.opacity=cvis2;
      drawVisual('vcv'+j,s,clamp01((lt-at2-0.1)/(d*0.55)));
    }

    // fondos con deriva determinista
    var bg=bgEls[j];
    for(var b=0;b<bg.length;b++){
      var phase=b*1.7+i*2.1;
      var amp=b===0?20:15;
      bg[b].style.transform='translate('+(Math.sin(lt*0.5+phase)*amp)+'px,'+(Math.sin(lt*0.4+phase)*12)+'px)';
    }
  }
}

window.renderFrame=renderFrame;
renderFrame(0);

document.fonts.ready.then(function(){
  Promise.all([
    document.fonts.load('400 20px Inter'),
    document.fonts.load('700 68px Inter'),
    document.fonts.load('900 68px Inter')
  ]).then(function(){window.__READY=true;renderFrame(0);}).catch(function(){window.__READY=true;renderFrame(0);});
});
setTimeout(function(){window.__READY=true;renderFrame(0);},5000);
})();
</script>
</body>
</html>
